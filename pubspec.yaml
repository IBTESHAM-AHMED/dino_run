name: dino_run
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '3.6.0-216.1.beta'


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.20.0
  collection: ^1.19.0
  material_color_utilities: ^0.11.1
  meta: ^1.15.0
  provider: ^6.1.2
  flame_audio: ^2.10.4
  hive: ^2.2.3
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  lints: ^5.1.0
  test_api: ^0.7.3
  stack_trace: ^1.11.1
  string_scanner: ^1.3.0
  vm_service: ^14.2.5
  leak_tracker: ^10.0.7
  leak_tracker_flutter_testing: ^3.0.8

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/AngryPig/
    - assets/images/parallax/
    - assets/images/Bat/
    - assets/images/Rino/
    - assets/audio/


